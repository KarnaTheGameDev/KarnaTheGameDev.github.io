<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suman Raj Shetty — portfolio has moved</title>
    <link rel="canonical" href="https://suman-3d-portfolio.vercel.app/" />
    <meta http-equiv="refresh" content="0; url=https://suman-3d-portfolio.vercel.app/" />
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: flex;
        align-items: center; justify-content: center; text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f8fafc; color: #1d2235; padding: 2rem;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f1420; color: #e8ecf5; }
      }
      h1 { font-size: 1.5rem; margin: 0 0 .75rem; }
      p { margin: .4rem 0; color: #64748b; }
      a { color: #2b77e7; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>This portfolio has moved</h1>
      <p>It now lives at a new address.</p>
      <p><a href="https://suman-3d-portfolio.vercel.app/">suman-3d-portfolio.vercel.app</a></p>
      <p>Redirecting you automatically&hellip;</p>
    </main>
    <script>
      // Carry the path across, so an old link to /projects lands on /projects.
      location.replace(
        "https://suman-3d-portfolio.vercel.app" +
          location.pathname + location.search + location.hash
      );
    </script>
  </body>
</html>
